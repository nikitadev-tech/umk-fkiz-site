site_name: УМК по физической культуре
site_description: Учебно-методический комплекс
site_author: Кафедра ФКиЗ
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: ru
  custom_dir: overrides
  logo: https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f3c3.svg
  favicon: https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f3c3.svg

  font:
    text: Inter
    code: JetBrains Mono

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips

plugins:
  - search:
      lang:
        - ru
        - en
      separator: '[\s\-\.]+'
  - awesome-pages
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: "#"
      title: Содержание
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/solid/book
      link: /
      name: Главная
  analytics:
    provider: null

copyright: >
  © УМК · собрано автоматически из исходных документов
